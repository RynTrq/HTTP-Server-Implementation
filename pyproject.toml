[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-http-server"
version = "1.1.0"
description = "Hardened educational static-file HTTP server and client implemented with Python sockets."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Raiyaan" }]
dependencies = []

[project.scripts]
tcp-http-server = "tcp_http.server:main"
tcp-http-client = "tcp_http.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
